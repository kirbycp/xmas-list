<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>{{ page.title }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
  <style>
    :root {
      --bg: #f6f1e7;
      --card: #fffdf8;
      --text: #24302a;
      --muted: #5c675f;
      --green: #1f5a3f;
      --red: #a32a2f;
      --line: #e3dccd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a15;
        --card: #18241e;
        --text: #eee9dd;
        --muted: #a9b3ab;
        --green: #86c9a3;
        --red: #f0908f;
        --line: #2c3b33;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px 56px;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 6px solid var(--red);
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 8px;
      color: var(--green);
      font: 700 2.2rem/1.15 Georgia, "Times New Roman", serif;
    }
    h2 {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 400;
    }
    ul { margin: 0; padding: 0; list-style: none; }
    main > ul > li {
      padding: 14px 0;
      border-top: 1px solid var(--line);
      font-weight: 600;
    }
    li ul { margin-top: 6px; padding-left: 18px; font-weight: 400; }
    li li { padding: 3px 0; }
    li li li { color: var(--muted); }
    a { color: var(--red); text-underline-offset: 3px; }
    @media (max-width: 480px) {
      body { padding: 16px 12px 40px; }
      main { padding: 24px 18px; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <main>
{{ content }}
  </main>
</body>
</html>
